apply plugin: 'com.android.library'

group = 'expo.modules.boomerang'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.boomerang"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Minimal 1.8.1 GL fix over Expo 54's 1.8.0. Media3's published dependency
  // constraints align the complete runtime graph; CI verifies every component.
  implementation 'androidx.media3:media3-transformer:1.8.1'
  implementation 'androidx.media3:media3-effect:1.8.1'
  implementation 'androidx.media3:media3-common:1.8.1'
}
