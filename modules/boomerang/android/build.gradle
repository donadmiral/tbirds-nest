apply plugin: 'com.android.library'

group = 'expo.modules.boomerang'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()
useDefaultAndroidSdkVersions()

android {
  namespace "expo.modules.boomerang"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // 1.11.1 preserves reordered B-frames at trim ends. Its published constraints
  // align Expo playback too; the pinned Expo load-control plugin adapts the two
  // changed interface signatures, and CI verifies the complete runtime graph.
  implementation 'androidx.media3:media3-transformer:1.11.1'
  implementation 'androidx.media3:media3-effect:1.11.1'
  implementation 'androidx.media3:media3-common:1.11.1'
}
