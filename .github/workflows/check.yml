# Runs the check that has actually been catching bugs: the TypeScript compiler.
#
# Deliberately narrow. A broad pipeline nobody trusts gets ignored; one job that
# fails only on real breakage gets read.
name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    name: web typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      # Node 22: the runners now force 24 on anything targeting 20, which prints
      # a deprecation warning on every run.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Printed before anything can fail, so a broken run says where it broke
      # instead of only reporting an exit code.
      - name: Environment
        run: |
          echo "node $(node -v)"
          echo "npm  $(npm -v)"
          echo "workdir $(pwd)"
          ls -la package.json package-lock.json

      # No cache: the cache action fails the job outright when its path does not
      # resolve, which turns a speed optimisation into a source of red builds.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit
