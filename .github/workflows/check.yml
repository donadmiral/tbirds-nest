# Runs the check that has actually been catching bugs: the TypeScript compiler.
#
# It is deliberately narrow. A broad pipeline that nobody trusts gets ignored;
# one job that fails only on real breakage gets read. Tests can be added as
# steps here once they exist.
name: check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  web:
    name: web typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        # .next holds generated route types that only exist after a build, so
        # they are excluded rather than allowed to fail the run on files nobody
        # wrote.
        run: npx tsc --noEmit

      - name: Build
        working-directory: web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
