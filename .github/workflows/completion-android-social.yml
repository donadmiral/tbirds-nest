name: Recover the original Android social cases

on:
  # Retained historical consumer. Run only by explicit dispatch; current builds
  # and cases run through native-product-audit.yml with their own source identity.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: completion-android-social-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_APP_ENV: qa
  EXPO_PUBLIC_SUPABASE_URL: https://uaulhuelcfkjwojtymmw.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: native-ui-synthetic-no-provider-key
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'

jobs:
  android-social:
    name: Original 31 Android social cases on a fresh emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Read reviewed consumer tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: recovery-tools
          persist-credentials: false
      - name: Require the independently verified producer binding
        id: binding
        run: |
          artifact_id="$(python3 recovery-tools/scripts/quality/completion-android-social.py --artifact-id)"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Read the exact source used to build the APK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f5be97445ef7223baeb60dd10e8cded05630b6c1
          path: baseline
          persist-credentials: false
      - name: Retrieve the verified APK without rebuilding
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.binding.outputs.artifact_id }}
          merge-multiple: true
          path: baseline/native-audit-binary
          run-id: 41259529351
          github-token: ${{ github.token }}
      - name: Prepare the original disposable device environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          test -d "${ANDROID_HOME:?The runner must provide its Android SDK}"
          printf '%s\n' "$ANDROID_HOME/platform-tools" "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpulse0 ffmpeg xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Install the source-bound Maestro version
        working-directory: baseline
        run: bash scripts/quality/install-native-ui-tools.sh
      - name: Run the original full social group exactly once
        env:
          CONSUMER_SOURCE: ${{ github.sha }}
        run: |
          python3 recovery-tools/scripts/quality/completion-android-social.py \
            --baseline "$PWD/baseline" --consumer-source "$CONSUMER_SOURCE"
      - name: Retain every original case, timing, receipt and setup failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: completion-android-social-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            baseline/native-audit-results/
            baseline/native-ui-logs/
          if-no-files-found: warn
          retention-days: 7
