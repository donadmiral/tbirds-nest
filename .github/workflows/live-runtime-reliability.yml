name: Live runtime reliability regression
on:
  push:
    branches: [codex/live-completion-20261102]
    paths:
      - supabase/migrations/*live_control_result_unambiguous.sql
      - supabase/migrations/*live_failed_start_recovery.sql
      - supabase/tests/rpc-authorization/test-live-control-result.mjs
      - supabase/tests/rpc-authorization/test-live-failed-start-recovery.mjs
      - supabase/functions/live-core/**
      - supabase/functions/live-maintenance/**
      - supabase/functions/_shared/dailyCommandAcknowledgement.ts
      - supabase/tests/live-command-ack.test.cjs
      - supabase/tests/live-provider.test.cjs
      - supabase/tests/live-provider-diagnostics.test.cjs
      - .github/workflows/live-runtime-reliability.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-runtime-reliability
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: 22, cache: npm}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix supabase/tests/rpc-authorization --ignore-scripts --no-audit --no-fund
      - name: Verify Daily acknowledgements and preserve control authorization
        run: node --test supabase/tests/live-command-ack.test.cjs supabase/tests/live-provider.test.cjs supabase/tests/live-provider-diagnostics.test.cjs
      - name: Reproduce and prevent the actual hosted control-completion defect
        run: node --test supabase/tests/rpc-authorization/test-live-control-result.mjs supabase/tests/rpc-authorization/test-live-failed-start-recovery.mjs
      - name: Preserve existing UI, scheduling, clipping and lifecycle contracts
        run: node --test tests/live-setup.test.cjs tests/live-ui-repair.test.cjs tests/live-studio-events.test.cjs tests/live-native-contracts.test.cjs tests/live-native-clips.test.cjs
      - name: Check native types
        run: npx tsc --noEmit --incremental false
      - run: git diff --exit-code
