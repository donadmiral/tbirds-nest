# The gate that would have caught the payments error which broke every Vercel
# build of the operations app while nobody knew.
#
# Three apps live in this repository and each has its own dependencies, so each
# gets its own job. The two Next.js apps block the build because Vercel already
# compiles them and they are known to be clean. The phone app joined them on 30 Aug 2026,
# the day its backlog reached zero.

name: Type check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-web:
    name: Operations app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
        working-directory: admin-web
      - run: npx tsc --noEmit
        working-directory: admin-web
      - name: Test operations quality regressions
        run: node --test tests/*.cjs
        working-directory: admin-web

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm ci --prefix supabase/tests/rpc-authorization
      - name: Test web quality regressions
        run: node --test tests/*.cjs tests/quality/*.cjs
        working-directory: web

  phone:
    name: Phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Test phone and call quality regressions
        run: node --test tests/*.cjs tests/quality/*.cjs
      - run: npm ci --prefix supabase/tests/rpc-authorization
      - name: Test payment recovery and database boundaries
        env:
          PGLITE_MODULE: ${{ github.workspace }}/supabase/tests/rpc-authorization/node_modules/@electric-sql/pglite/dist/index.cjs
          TRINITI_PGLITE_MODULE: ${{ github.workspace }}/supabase/tests/rpc-authorization/node_modules/@electric-sql/pglite/dist/index.js
        run: node --experimental-strip-types --test supabase/tests/*.test.*
      - name: Test RPC authorization
        run: npm test --prefix supabase/tests/rpc-authorization
