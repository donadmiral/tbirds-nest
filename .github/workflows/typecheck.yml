# The gate that would have caught the payments error which broke every Vercel
# build of the operations app while nobody knew.
#
# Three apps live in this repository and each has its own dependencies, so each
# gets its own job. The two Next.js apps block the build because Vercel already
# compiles them and they are known to be clean. The phone app joined them on 30 Aug 2026,
# the day its backlog reached zero.

name: Type and quality gates

on:
  push:
    branches: [master, codex/completion-20261101, codex/web-admin-media-parity-20261101, codex/live-completion-20261102, codex/loading-foundation-20261105]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-concurrency:
    name: Isolated PostgreSQL 17 concurrency contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGHOST: /tmp/pc-capacity-ci-socket
      PGPORT: '5432'
      PGUSER: pc_test
      PC_TEST_PSQL: /usr/bin/psql
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci --prefix supabase/tests/rpc-authorization --no-fund
      - name: Start a disposable database with no TCP listener
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          mkdir -p "$PGHOST"
          chmod 777 "$PGHOST"
          docker run --detach --name pc-capacity-postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust --env POSTGRES_USER=pc_test \
            --mount "type=bind,src=$PGHOST,dst=/var/run/postgresql" \
            postgres:17.11 -c listen_addresses='' -c jit=off
          ready=false
          for attempt in $(seq 1 60); do
            # Ignore the temporary initdb server, which shuts down before the
            # final database starts accepting the contract test connections.
            if docker logs pc-capacity-postgres 2>&1 | grep -F 'PostgreSQL init process complete; ready for start up.' > /dev/null; then
              if pg_isready --dbname=postgres; then ready=true; break; fi
            fi
            sleep 1
          done
          test "$ready" = true
          psql --dbname=postgres --command='select version(), inet_server_addr();'
          for database in pc_scale_counters pc_scale_feed pc_scale_paging pc_scale_context pc_scale_business pc_scale_mentions pc_scale_media_jobs pc_scale_service_proof pc_scale_feed_rank pc_scale_distributed_counters pc_scale_notification_fanout pc_scale_admin_projection pc_scale_media_v2 pc_scale_observability pc_scale_book_window pc_scale_unique_reach pc_scale_push_badge pc_scale_notification_worker pc_scale_media_tickets pc_scale_live_cancel; do
            createdb "$database"
          done
      - name: Verify real lock waits, retries, access boundaries and cleanup
        run: |
          PGDATABASE=pc_scale_counters node supabase/tests/engagement-counters-concurrency.test.cjs
          PGDATABASE=pc_scale_feed node supabase/tests/feed-live.test.cjs
          PGDATABASE=pc_scale_paging node supabase/tests/paged-readers-concurrency.test.cjs
          PGDATABASE=pc_scale_context node supabase/tests/context-inbox-db.test.cjs
          PGDATABASE=pc_scale_business node supabase/tests/business-inbox-db.test.cjs
          PGDATABASE=pc_scale_mentions node supabase/tests/inbox-mentions-db.test.cjs
          PGDATABASE=pc_scale_media_jobs node supabase/tests/media-processing-db.test.cjs
          PGDATABASE=pc_scale_service_proof node supabase/tests/service-authorization-proof-db.test.cjs
          PGDATABASE=pc_scale_feed_rank node supabase/tests/feed-scale-db.test.cjs
          PGDATABASE=pc_scale_distributed_counters node supabase/tests/distributed-counters-db.test.cjs
          PGDATABASE=pc_scale_notification_fanout node supabase/tests/notification-fanout-db.test.cjs
          PGDATABASE=pc_scale_admin_projection node supabase/tests/admin-projection-db.test.cjs
          PGDATABASE=pc_scale_media_v2 node supabase/tests/media-renditions-db.test.cjs
          PGDATABASE=pc_scale_observability node supabase/tests/capacity-observability.test.cjs
          PGDATABASE=pc_scale_book_window node supabase/tests/memory-book-window-db.test.cjs
          PGDATABASE=pc_scale_unique_reach node supabase/tests/unique-view-share-db.test.cjs
          PGDATABASE=pc_scale_push_badge node supabase/tests/push-badge-db.test.cjs
          PGDATABASE=pc_scale_notification_worker node supabase/tests/notification-worker-db.test.cjs
          PGDATABASE=pc_scale_media_tickets node supabase/tests/media-content-tickets-db.test.cjs
          PGDATABASE=pc_scale_live_cancel node supabase/tests/live-cancel-cleanup-db.test.cjs
      - name: Remove the disposable database
        if: always()
        run: docker rm --force pc-capacity-postgres || true

  edge-tls:
    name: Link preview Edge TLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4
      - name: Verify Edge runtime version
        run: deno --version
      - name: Check authenticated push, media and Live handlers and their pinned dependencies
        run: |
          deno check --no-lock --node-modules-dir=none \
            supabase/functions/send-push-notification/index.ts \
            supabase/functions/send-push-notification/compatibility-index.ts \
            supabase/functions/send-voip-push/index.ts \
            supabase/functions/send-voip-push/compatibility-index.ts \
            supabase/functions/daily-get-token/compatibility-index.ts \
            supabase/functions/process-notification-outbox/index.ts \
            supabase/functions/media-content/index.ts \
            supabase/functions/content-media-sign/index.ts \
            supabase/functions/media-broker/index.ts \
            supabase/functions/live-playback/index.ts \
            supabase/functions/live-stage/index.ts \
            supabase/functions/live-control/index.ts \
            supabase/functions/live-cover/index.ts \
            supabase/functions/live-provider-webhook/index.ts \
            supabase/functions/live-maintenance/index.ts \
            supabase/functions/live-provider-configure/index.ts \
            supabase/functions/live-sign/index.ts \
            supabase/functions/live-clip-media/index.ts \
            supabase/functions/live-clip-worker/index.ts \
            supabase/functions/live-clip-scaler/index.ts \
            supabase/functions/live-connect/index.ts \
            supabase/functions/live-social/index.ts \
            supabase/functions/live-social-worker/index.ts \
            supabase/functions/live-social-pull/index.ts \
            supabase/functions/live-transcription-worker/index.ts
      - name: Test actual pinned-IP HTTPS and cancellation
        env:
          PLATINUM_LINK_TLS_FIXTURE: ${{ runner.temp }}/platinum-link-tls
        run: |
          mkdir -p "$PLATINUM_LINK_TLS_FIXTURE"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=preview.example.com' \
            -addext 'subjectAltName=DNS:preview.example.com' \
            -addext 'basicConstraints=critical,CA:FALSE' \
            -addext 'extendedKeyUsage=serverAuth' \
            -keyout "$PLATINUM_LINK_TLS_FIXTURE/key.pem" \
            -out "$PLATINUM_LINK_TLS_FIXTURE/cert.pem"
          deno test --node-modules-dir=none --no-lock \
            --allow-net=127.0.0.1,preview.example.com,wrong.example.com \
            --allow-read="$PLATINUM_LINK_TLS_FIXTURE" \
            --allow-env=PLATINUM_LINK_TLS_FIXTURE,NODE_DEBUG,NODE_EXTRA_CA_CERTS,NODE_TLS_REJECT_UNAUTHORIZED \
            supabase/tests/link-preview.deno.ts

  admin-web:
    name: Operations app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
        working-directory: admin-web
      - run: npx tsc --noEmit
        working-directory: admin-web
      - name: Test operations quality regressions
        run: node --test --test-concurrency=2 tests/*.cjs
        working-directory: admin-web

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm ci --prefix supabase/tests/rpc-authorization
      - name: Test web quality regressions
        run: node --test --test-concurrency=2 tests/*.cjs tests/quality/*.cjs
        working-directory: web

  phone:
    name: Phone app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            admin-web/package-lock.json
            supabase/tests/rpc-authorization/package-lock.json
            workers/media-renditions/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Install dependencies for cross-app and database regressions
        run: |
          npm ci --prefix web
          npm ci --prefix admin-web
          npm ci --prefix supabase/tests/rpc-authorization
          npm ci --prefix workers/media-renditions
      - name: Test phone, diagnostics, feed and call regressions
        run: node --test --test-concurrency=2 tests/*.cjs tests/quality/*.cjs
      - name: Test adaptive media processing
        run: |
          timeout --signal=TERM --kill-after=10s 300s bash scripts/quality/install-linux-test-runtime.sh media
          node --test workers/media-renditions/test/*.test.mjs
      - name: Test payment recovery, Live Edge authorization and database boundaries
        env:
          PGLITE_MODULE: ${{ github.workspace }}/supabase/tests/rpc-authorization/node_modules/@electric-sql/pglite/dist/index.cjs
          TRINITI_PGLITE_MODULE: ${{ github.workspace }}/supabase/tests/rpc-authorization/node_modules/@electric-sql/pglite/dist/index.js
        # The glob covers Live core, clip/queue, OAuth/social/pull and transcription
        # authorization suites; do not duplicate them in the worker job.
        run: node --experimental-strip-types --test --test-concurrency=2 supabase/tests/*.test.*
      - name: Test RPC authorization
        run: npm test --prefix supabase/tests/rpc-authorization

  live-workers:
    name: Live workers, finite launcher and infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.2
          cache: npm
          cache-dependency-path: workers/live-transcription/package-lock.json
      - name: Install fixed worker dependencies and synthetic-media tools
        run: |
          npm ci --prefix workers/live-transcription --ignore-scripts --no-audit --no-fund
          timeout --signal=TERM --kill-after=10s 300s bash scripts/quality/install-linux-test-runtime.sh media
          python3 -m venv /tmp/platinum-live-cfnlint
          /tmp/platinum-live-cfnlint/bin/pip install cfn-lint==1.59.0
      - name: Test bounded render, publishing and transcription workers
        run: |
          node --test --test-concurrency=2 workers/live-clips/test/*.test.mjs
          npm test --prefix workers/live-social
          npm test --prefix workers/live-transcription
      - name: Test shared runtime admission and deployment boundaries
        run: |
          python3 infrastructure/live-clips/test/launcher_test.py
          node --test infrastructure/live-clips/test/*.test.mjs infrastructure/live-social/test/*.test.mjs infrastructure/live-transcription/test/*.test.mjs infrastructure/live-integrations/test/*.test.mjs
      - name: Validate reviewed templates in the selected AWS region
        run: |
          /tmp/platinum-live-cfnlint/bin/cfn-lint \
            infrastructure/live-clips/*-cloudformation.json \
            infrastructure/live-social/*-cloudformation.json \
            infrastructure/live-transcription/*-cloudformation.json \
            infrastructure/live-integrations/*-cloudformation.json -r us-east-2
        # Fixture encodes/template checks are not production image scans,
        # hosted-provider acceptance, deployment, or a capacity certification.
