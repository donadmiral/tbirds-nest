name: iOS memory asset diagnosis

on:
  push:
    branches:
      - codex/live-ios-memory-asset-probe-20261104
    paths:
      - 'scripts/quality/MemoryAssetLoadProbe.swift'
      - 'scripts/quality/ios-memory-asset-probe.py'
      - 'tests/quality/test_ios_memory_asset_probe.py'
      - '.github/workflows/ios-memory-asset-diagnostics.yml'

permissions:
  contents: read

concurrency:
  group: ios-memory-asset-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asset-probe:
    name: Load the exact local MP4 on Intel iOS 18.5
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      CI: 'true'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 4
      - name: Validate diagnostic evidence guards
        run: python3 -B -m unittest discover -s tests/quality -p test_ios_memory_asset_probe.py
      - name: Run one bounded standalone native probe
        run: python3 -B scripts/quality/ios-memory-asset-probe.py
      - name: Retain source-bound native diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-memory-asset-diagnostics
          path: native-memory-asset-logs/
          if-no-files-found: error
          retention-days: 7
