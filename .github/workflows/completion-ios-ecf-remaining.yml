name: Recover current-source iPhone social and settings cases

on:
  push:
    branches: [codex/completion-20261101]
    paths:
      - .github/workflows/completion-ios-ecf-remaining.yml
      - scripts/quality/completion-ios-ecf-remaining.py
      - scripts/quality/completion-ios-social-flow-corrections.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_APP_ENV: qa
  EXPO_PUBLIC_SUPABASE_URL: https://uaulhuelcfkjwojtymmw.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: native-ui-synthetic-no-provider-key
  MAESTRO_CLI_NO_ANALYTICS: 'true'
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'

jobs:
  ios-remaining:
    name: Current iPhone original ${{ matrix.shard }} cases
    runs-on: macos-15-intel
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        shard: [social, settings]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Read reviewed recovery tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: recovery-tools
          persist-credentials: false
      - name: Require the independently verified current producer binding
        id: binding
        run: |
          artifact_id="$(python3 recovery-tools/scripts/quality/completion-ios-ecf-account.py --artifact-id)"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Read the exact current source used to build the app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ecf5e5a960106d7cb04c211ee99e9e89c09642cc
          path: baseline
          persist-credentials: false
      - name: Retrieve the verified current Simulator app
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.binding.outputs.artifact_id }}
          merge-multiple: true
          path: baseline/native-audit-binary
          run-id: 41266020074
          github-token: ${{ github.token }}
      - name: Prepare consumer tools without rebuilding
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
      - name: Install the exact source-bound Maestro version
        working-directory: baseline
        run: bash scripts/quality/install-native-ui-tools.sh
      - name: Run the original declared cases with reviewed setup and interactions
        env:
          CONSUMER_SOURCE: ${{ github.sha }}
          AUDIT_SHARD: ${{ matrix.shard }}
        run: |
          python3 recovery-tools/scripts/quality/completion-ios-ecf-remaining.py \
            --baseline "$PWD/baseline" --consumer-source "$CONSUMER_SOURCE" --shard "$AUDIT_SHARD"
      - name: Retain every case, executed correction and setup result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-ios-${{ matrix.shard }}-recovery-results
          path: baseline/native-audit-results/
          if-no-files-found: warn
          retention-days: 7
