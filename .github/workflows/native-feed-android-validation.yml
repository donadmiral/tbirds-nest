# Explicit branch push validates unchanged application source 0810ea8a30cd3818878b60fccea0689a453a3b19.
name: Android feed return validation
on:
  push:
    branches: [codex/live-feed-refresh-20261104]
    paths: [.github/workflows/native-feed-android-validation.yml]
permissions:
  contents: read
concurrency:
  group: native-feed-refresh-20261104
  cancel-in-progress: false

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_APP_ENV: qa
  EXPO_PUBLIC_SUPABASE_URL: https://uaulhuelcfkjwojtymmw.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: native-ui-synthetic-no-provider-key
  MAESTRO_CLI_NO_ANALYTICS: 'true'


jobs:
  android-app:
    name: Tap through the full Android Emulator app
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Use Java 17 and emulator host support
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-ui-logs
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=1 -o DPkg::Lock::Timeout=30 update \
            2>&1 | tee -a native-ui-logs/host-setup.log
          sudo timeout --kill-after=15s 180s apt-get \
            -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
            -o Acquire::Retries=1 -o DPkg::Lock::Timeout=30 install --yes --no-install-recommends \
            libpulse0 ffmpeg xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            2>&1 | tee -a native-ui-logs/host-setup.log
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - run: npm ci --ignore-scripts --no-fund
      - run: bash scripts/quality/install-native-ui-tools.sh
      - run: bash scripts/quality/test-android-app-ui.sh
      - name: Retain actual app UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-full-app-ui
          path: native-ui-logs/
          if-no-files-found: ignore
          retention-days: 7
