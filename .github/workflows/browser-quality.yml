name: Browser interaction and video gates

on:
  pull_request:
    paths:
      - 'admin-web/**'
      - 'web/**'
      - 'shared/**'
      - '.github/workflows/browser-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-browser:
    name: Connected app, Studio, admin and encoded movies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLATINUM_UI_OUTPUT: /tmp/platinum-admin-browser
      PLATINUM_UI_ARTIFACTS: /tmp/platinum-browser-evidence/admin
      STORY_QA_OUTPUT: /tmp/platinum-browser-evidence/video
      MEMORY_QA_OUTPUT: /tmp/platinum-browser-evidence/memory
      MEMORY_COVER_QA_OUTPUT: /tmp/platinum-browser-evidence/memory-cover
      MUSIC_QA_OUTPUT: /tmp/platinum-browser-evidence/music
      PLATINUM_SOCIAL_ARTIFACTS: /tmp/platinum-browser-evidence/web
      PLATINUM_COMMERCE_ARTIFACTS: /tmp/platinum-browser-evidence/commerce
      PLATINUM_STUDIO_UI_OUTPUT: /tmp/platinum-studio-browser
      PLATINUM_STUDIO_UI_ARTIFACTS: /tmp/platinum-browser-evidence/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        id: node_setup
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin-web/package-lock.json
      - name: Install locked browser and admin dependencies
        id: dependencies
        run: |
          npm ci --prefix web --no-fund
          npm ci --prefix admin-web --no-fund
      - name: Install browser and media verification tools
        id: browser_tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          node web/node_modules/playwright/cli.js install --with-deps chromium
          node -e 'const p=require("./web/node_modules/playwright").chromium.executablePath(); console.log("PLATINUM_CHROMIUM="+p); console.log("STORY_QA_CHROME="+p)' >> "$GITHUB_ENV"
      - name: Exercise actual admin components
        # Run independent gates after an earlier test fails, but only after successful setup.
        # Ordinary step failures still fail the job; cancellation stops further gates.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: |
          node admin-web/tests/browser/compile.cjs
          node admin-web/tests/browser/run.cjs
      - name: Exercise public-web navigation, account changes and recovery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: node web/tests/browser/social-run.cjs
      - name: Exercise jobs, application review, market offers and orders
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: node web/tests/browser/commerce-run.cjs
      - name: Exercise Studio approval, campaign and creator journeys
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: |
          node web/tests/browser/studio-compile.cjs
          node web/tests/browser/studio-run.cjs
      - name: Export and decode actual graded story video
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: node web/tests/browser/story-video-export.cjs
      - name: Export and decode full memory movies and audio mixes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: node web/tests/browser/memory-movie-export.cjs
      - name: Exercise book design, persistence, conflicts and account changes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: node web/tests/browser/memory-cover-run.cjs
      - name: Verify private original uploads, microphone capture and retained music exports
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node_setup.outcome == 'success' && steps.dependencies.outcome == 'success' && steps.browser_tools.outcome == 'success' }}
        run: node web/tests/browser/music-library-export.cjs
      - name: Keep synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-quality-evidence
          path: |
            /tmp/platinum-browser-evidence/admin/*.png
            /tmp/platinum-browser-evidence/admin/*.json
            /tmp/platinum-browser-evidence/video/*.json
            /tmp/platinum-browser-evidence/memory/*.json
            /tmp/platinum-browser-evidence/memory/*.png
            /tmp/platinum-browser-evidence/memory-cover/*.json
            /tmp/platinum-browser-evidence/memory-cover/*.png
            /tmp/platinum-browser-evidence/music/*.json
            /tmp/platinum-browser-evidence/music/*.png
            /tmp/platinum-browser-evidence/web/*.png
            /tmp/platinum-browser-evidence/web/*.json
            /tmp/platinum-browser-evidence/commerce/*.png
            /tmp/platinum-browser-evidence/commerce/*.json
            /tmp/platinum-browser-evidence/studio/*.png
            /tmp/platinum-browser-evidence/studio/*.json
          if-no-files-found: ignore
          retention-days: 7
