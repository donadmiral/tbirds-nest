appId: app.platinumcircles.mobile.qa
name: Actual native memory capture and encoding
---
# The retained iOS runner delivered this same fixture URL between Maestro sessions.
# Keep the original route deadline, account readback and every capture action.
- extendedWaitUntil:
    visible: Native capture acceptance
    timeout: 30000
- extendedWaitUntil:
    visible: Saved account readback passed
    timeout: 15000
- tapOn: Open cancellation movie
- extendedWaitUntil:
    visible: Create memory movie
    timeout: 15000
- tapOn:
    text: Create memory movie
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: Reading the movie’s video timing…
    timeout: 15000
# Close as soon as progress is visible. The receipt separately requires a real
# first chunk, cancelled status, reader closure and cleanup.
- tapOn:
    text: Close movie export
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: Memory capture cleanup passed
    timeout: 15000
- tapOn: Open complete movie
- extendedWaitUntil:
    visible: Create memory movie
    timeout: 15000
- tapOn:
    text: Create memory movie
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
