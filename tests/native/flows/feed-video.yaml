appId: app.platinumcircles.mobile.qa
name: First feed video survives scroll refresh and tab return
---
# The video is already fully visible after each return to the top. Centering
# against the whole device can scroll the post behind the fixed feed header,
# leaving less than the production 55% row threshold. Require visible media
# without moving an already visible card out of its playing position.
- scrollUntilVisible:
    element:
      id: native-feed-video
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-playing
- scrollUntilVisible:
    element: Feed scroll checkpoint.
    direction: DOWN
    centerElement: true
- assertNotVisible: Native feed video playing
# Return through the real list's scroll-to-top handler, then use the same
# fully visible video position that established playback before scrolling.
- runFlow: reveal-main-tabs.yaml
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
- scrollUntilVisible:
    element:
      id: native-feed-video
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-returned
# The selected Home tab uses the real list's useScrollToTop handler.
- runFlow: reveal-main-tabs.yaml
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
- swipe:
    start: 50%, 43%
    end: 50%, 90%
    duration: 700
- scrollUntilVisible:
    element:
      id: native-feed-video
    direction: DOWN
    visibilityPercentage: 100
    centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-refreshed
- runFlow: reveal-main-tabs.yaml
- tapOn:
    id: main-tab-messages
- extendedWaitUntil:
    visible: '(?s)^(?:Ready for our next adventure\?|(?:.*?, )?Jordan Ellis, (?:.*?, )?Ready for our next adventure\?(?:, .*)?)$'
    timeout: 15000
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-resumed
# Restore the original navigation journey's starting scroll position.
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
