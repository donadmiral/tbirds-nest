appId: app.platinumcircles.mobile.qa
name: First feed video survives scroll refresh and tab return
---
- scrollUntilVisible:
    element:
      id: native-feed-video
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-playing
- scrollUntilVisible:
    element: Feed scroll checkpoint.
    direction: DOWN
    centerElement: true
- assertNotVisible: Native feed video playing
- scrollUntilVisible:
    # The video accessibility bounds can be clipped by the sticky header.
    # Restore the post's caption so the whole card meets normal autoplay rules.
    element: A quiet morning in the desert. Small moments worth keeping.
    direction: UP
    centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-returned
# The selected Home tab uses the real list's useScrollToTop handler.
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
- swipe:
    start: 50%, 43%
    end: 50%, 90%
    duration: 700
- scrollUntilVisible:
    element:
      id: native-feed-video
    direction: DOWN
    centerElement: true
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-refreshed
- tapOn:
    id: main-tab-messages
- extendedWaitUntil:
    visible: '(?s)^(?:Ready for our next adventure\?|(?:.*?, )?Jordan Ellis, (?:.*?, )?Ready for our next adventure\?(?:, .*)?)$'
    timeout: 15000
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-resumed
# Restore the original navigation journey's starting scroll position.
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
