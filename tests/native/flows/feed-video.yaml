appId: app.platinumcircles.mobile.qa
name: First feed video survives scroll refresh and tab return
---
# Android reports only the clipped part of this accessibility target as its
# bounds. Center it to bring the full video into the list viewport. iOS already
# exposes the full video at this position; centering there would move the post
# behind the fixed header and below the production 55% row visibility threshold.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: native-feed-video
          direction: DOWN
          visibilityPercentage: 100
          centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: native-feed-video
          direction: DOWN
          visibilityPercentage: 100
          centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-playing
# The final row can be fully visible at the iOS scroll boundary without being
# centered. Stop there and prove that the original video no longer plays.
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: Feed scroll checkpoint.
          direction: DOWN
          centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element: Feed scroll checkpoint.
          direction: DOWN
          visibilityPercentage: 100
          timeout: 20000
          centerElement: false
- assertNotVisible: Native feed video playing
# Return through the real list's scroll-to-top handler, then use the same
# fully visible video position that established playback before scrolling.
- runFlow: reveal-main-tabs.yaml
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: native-feed-video
          direction: DOWN
          visibilityPercentage: 100
          centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: native-feed-video
          direction: DOWN
          visibilityPercentage: 100
          centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-returned
# The selected Home tab uses the real list's useScrollToTop handler.
- runFlow: reveal-main-tabs.yaml
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
- swipe:
    start: 50%, 43%
    end: 50%, 90%
    duration: 700
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: native-feed-video
          direction: DOWN
          visibilityPercentage: 100
          centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: native-feed-video
          direction: DOWN
          visibilityPercentage: 100
          centerElement: false
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-refreshed
- runFlow: reveal-main-tabs.yaml
- tapOn:
    id: main-tab-messages
- extendedWaitUntil:
    visible: '(?s)^(?:Ready for our next adventure\?|(?:.*?, )?Jordan Ellis, (?:.*?, )?Ready for our next adventure\?(?:, .*)?)$'
    timeout: 15000
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Native feed video playing
    timeout: 15000
- takeScreenshot: feed-video-resumed
# Restore the original navigation journey's starting scroll position.
- tapOn:
    id: main-tab-feed
- extendedWaitUntil:
    visible: Your story
    timeout: 15000
