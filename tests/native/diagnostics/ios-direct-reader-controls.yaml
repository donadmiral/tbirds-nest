appId: app.platinumcircles.mobile.qa
name: Diagnostic direct saved memory reader controls
---
- runFlow: ../../../../baseline/tests/native/audit/flows/_signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: memory-reader-controls
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Edit memory book"
    timeout: 15000

- scrollUntilVisible:
    element: Open book
    direction: DOWN
    centerElement: false
- tapOn: Open book
- assertVisible: Page 1 of 2
- assertVisible: WE TOOK THE LONG WAY HOME
- tapOn: Next memory
- assertVisible: Page 2 of 2
- assertVisible: THE STORIES WE KEEP
- takeScreenshot: diagnostic-direct-reader-controls
