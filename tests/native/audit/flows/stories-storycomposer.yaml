appId: app.platinumcircles.mobile.qa
name: Audit StoryComposer
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: stories-storycomposer
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Save text sticker"
    timeout: 15000
- tapOn: Type here
- inputText: Audit story text
- tapOn: Save text sticker
- extendedWaitUntil:
    visible: "Next"
    timeout: 15000
- takeScreenshot: stories-storycomposer
