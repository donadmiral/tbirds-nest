appId: app.platinumcircles.mobile.qa
name: Audit MarketMain
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: navigation-marketmain
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "View listing: Travel journal"
    timeout: 15000
- takeScreenshot: navigation-marketmain
