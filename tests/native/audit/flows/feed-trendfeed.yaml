appId: app.platinumcircles.mobile.qa
name: Audit TrendFeed
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: feed-trendfeed
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "#memories"
    timeout: 15000
- extendedWaitUntil:
    visible: "No posts found"
    timeout: 15000
- assertVisible: "No one has posted with #memories yet."
- takeScreenshot: feed-trendfeed
