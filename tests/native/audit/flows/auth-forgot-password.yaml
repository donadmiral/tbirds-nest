appId: app.platinumcircles.mobile.qa
name: Audit password reset input validation
---
- runFlow: _signedout.yaml
- tapOn: Forgot password
- assertVisible: Reset password
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element: Send code
    direction: DOWN
    centerElement: true
- tapOn: Send code
- assertVisible: Enter your email address
- takeScreenshot: auth-forgot-password
