appId: app.platinumcircles.mobile.qa
name: Audit Businesses
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: business-businesses
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Businesses"
    timeout: 15000
- takeScreenshot: business-businesses
