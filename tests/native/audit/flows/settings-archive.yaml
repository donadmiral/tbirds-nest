appId: app.platinumcircles.mobile.qa
name: Audit Archive
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: settings-archive
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Archive"
    timeout: 15000
- takeScreenshot: settings-archive
