appId: app.platinumcircles.mobile.qa
name: Audit HiddenWords
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: settings-hiddenwords
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Hidden words"
    timeout: 15000
- takeScreenshot: settings-hiddenwords
