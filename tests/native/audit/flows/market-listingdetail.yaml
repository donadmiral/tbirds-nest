appId: app.platinumcircles.mobile.qa
name: Audit ListingDetail
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: market-listingdetail
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Make offer"
    timeout: 15000
- takeScreenshot: market-listingdetail
