appId: app.platinumcircles.mobile.qa
name: Audit SavedMessages
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: messages-savedmessages
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Saved Messages"
    timeout: 15000
- takeScreenshot: messages-savedmessages
