appId: app.platinumcircles.mobile.qa
name: Audit direct message recipient search
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: messages-recipient-search
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "New message"
    timeout: 15000

- tapOn: Search message recipients
- inputText: Jordan
- extendedWaitUntil:
    visible: '(?s).*Jordan Ellis.*'
    timeout: 15000
- tapOn: Clear search
- assertVisible: New message
- takeScreenshot: messages-recipient-search
