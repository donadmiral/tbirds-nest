appId: app.platinumcircles.mobile.qa
name: Audit StoryLayout
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: stories-storylayout
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Layout"
    timeout: 15000
- takeScreenshot: stories-storylayout
