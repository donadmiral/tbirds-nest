appId: app.platinumcircles.mobile.qa
name: Audit empty notifications
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: notifications-empty-controls
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Activity"
    timeout: 15000

- assertVisible: Nothing yet
- assertNotVisible: Mark all read
- assertVisible: Nothing yet
- takeScreenshot: notifications-empty-controls
