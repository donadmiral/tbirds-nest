appId: app.platinumcircles.mobile.qa
name: Audit ArticleCompose
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: feed-articlecompose
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Article"
    timeout: 15000
- takeScreenshot: feed-articlecompose
