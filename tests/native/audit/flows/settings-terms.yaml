appId: app.platinumcircles.mobile.qa
name: Audit Terms
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: settings-terms
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Terms of Service"
    timeout: 15000
- takeScreenshot: settings-terms
