appId: app.platinumcircles.mobile.qa
name: Audit appearance control
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: settings-appearance
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Settings"
    timeout: 15000

- tapOn: Search settings
- inputText: Appearance
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn: '^(?:[\uE000-\uF8FF], )?Appearance, (?:Follows your phone|Light|Dim|Lights out)(?:, [\uE000-\uF8FF])?$'
- tapOn: Lights out
- assertVisible: Settings
- assertVisible: '^(?:[\uE000-\uF8FF], )?Appearance, Lights out(?:, [\uE000-\uF8FF])?$'
- takeScreenshot: settings-appearance
