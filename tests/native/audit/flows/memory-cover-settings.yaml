appId: app.platinumcircles.mobile.qa
name: Audit independent cover settings entry
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: memory-cover-settings
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Edit memory book"
    timeout: 15000

- tapOn: Edit memory book
- assertVisible: Book settings
- longPressOn: Book title
- tapOn: 'Select [Aa]ll'
- eraseText: 1
- inputText: AUDIT BOOK TITLE
- copyTextFrom: Book title
- assertTrue: ${maestro.copiedText === "AUDIT BOOK TITLE"}
# A harmless heading inside the real handled-taps ScrollView dismisses focus.
# Android hideKeyboard sends Back and can close this settings modal.
- scrollUntilVisible:
    element: Paper tint
    direction: DOWN
    centerElement: true
- tapOn: Paper tint
- assertVisible: Book settings
- assertVisible: Save memory book
- tapOn: Save memory book
- extendedWaitUntil:
    notVisible: Book settings
    timeout: 15000
- assertVisible: '(?s)^.*book cover: AUDIT BOOK TITLE\..*$'
- tapOn: Edit memory book
- assertVisible: Book settings
- copyTextFrom: Book title
- assertTrue: ${maestro.copiedText === "AUDIT BOOK TITLE"}
- tapOn: Cancel memory book edits
- extendedWaitUntil:
    notVisible: Book settings
    timeout: 15000
- takeScreenshot: memory-cover-settings
