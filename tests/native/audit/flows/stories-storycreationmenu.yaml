appId: app.platinumcircles.mobile.qa
name: Audit StoryCreationMenu
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: stories-storycreationmenu
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Create"
    timeout: 15000
- takeScreenshot: stories-storycreationmenu
