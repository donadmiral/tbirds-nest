appId: app.platinumcircles.mobile.qa
name: Audit support history-error
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: support-history-error
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "(?i).*(could not load|try again|retry).*"
    timeout: 15000
- takeScreenshot: support-history-error
