appId: app.platinumcircles.mobile.qa
name: Audit search entry and clear
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: feed-search-controls
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Search"
    timeout: 15000

- tapOn: Search Platinum
- inputText: qa_jordan
- extendedWaitUntil:
    visible: '(?s).*Jordan Ellis.*'
    timeout: 15000
- tapOn: Clear search
- assertVisible: Search Platinum
- takeScreenshot: feed-search-controls
