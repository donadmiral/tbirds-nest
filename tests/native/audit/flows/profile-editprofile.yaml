appId: app.platinumcircles.mobile.qa
name: Audit EditProfile
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: profile-editprofile
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Edit profile"
    timeout: 15000
- takeScreenshot: profile-editprofile
