appId: app.platinumcircles.mobile.qa
name: Audit JobDetail
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: jobs-jobdetail
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "About the role"
    timeout: 15000
- takeScreenshot: jobs-jobdetail
