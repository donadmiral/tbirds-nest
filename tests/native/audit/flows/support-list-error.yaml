appId: app.platinumcircles.mobile.qa
name: Audit support list error
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: support-list-error
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Contact support"
    timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element: Your messages could not be loaded. Please try again.
          direction: DOWN
          centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      # The notice is fully visible at the end of the form; it cannot center.
      - scrollUntilVisible:
          element: Your messages could not be loaded. Please try again.
          direction: DOWN
          centerElement: false
- extendedWaitUntil:
    visible: "(?i).*(could not load|try again|retry).*"
    timeout: 15000
- assertVisible: Try again
- takeScreenshot: support-list-error
