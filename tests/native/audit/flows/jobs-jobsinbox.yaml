appId: app.platinumcircles.mobile.qa
name: Audit JobsInbox
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: jobs-jobsinbox
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Job messages"
    timeout: 15000
- takeScreenshot: jobs-jobsinbox
