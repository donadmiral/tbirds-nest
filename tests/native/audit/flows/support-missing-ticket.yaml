appId: app.platinumcircles.mobile.qa
name: Audit support missing-ticket
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: support-missing-ticket
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "(?i).*(not found|unavailable|could not load).*"
    timeout: 15000
- takeScreenshot: support-missing-ticket
