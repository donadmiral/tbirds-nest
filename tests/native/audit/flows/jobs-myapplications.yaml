appId: app.platinumcircles.mobile.qa
name: Audit MyApplications
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: jobs-myapplications
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "My applications"
    timeout: 15000
- takeScreenshot: jobs-myapplications
