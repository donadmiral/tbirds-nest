appId: app.platinumcircles.mobile.qa
name: Audit CreateListing
---
- runFlow: _signin.yaml
- tapOn:
    id: native-audit-case-input
- inputText: market-createlisting
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Native audit launcher
- tapOn:
    id: native-audit-open-case
- extendedWaitUntil:
    visible: "Photos"
    timeout: 15000
- assertVisible: 1 of 4
- assertVisible: Add up to 10 photos. The first one is your cover.
- assertVisible: Next
- takeScreenshot: market-createlisting
