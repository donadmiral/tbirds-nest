plugins {
  id 'com.android.application' version '8.11.0'
  id 'org.jetbrains.kotlin.android' version '2.1.20'
}
android {
  namespace 'expo.modules.securemedia.acceptance'
  compileSdk 36
  defaultConfig {
    applicationId 'app.platinumcircles.securemediatest'
    minSdk 24
    targetSdk 35
    versionCode 1
    versionName '1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = '17' }
  sourceSets.main.java.srcDirs += layout.buildDirectory.dir('generated/production-crypto').get().asFile
}
tasks.register('copyProductionCrypto', Sync) {
  from '../../../modules/secure-media/android/src/main/java/expo/modules/securemedia'
  include 'SecureMediaCrypto.kt'
  into layout.buildDirectory.dir('generated/production-crypto/expo/modules/securemedia')
}
tasks.named('preBuild').configure { dependsOn 'copyProductionCrypto' }
dependencies {
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'junit:junit:4.13.2'
}
